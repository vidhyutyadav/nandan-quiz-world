/* सभी डिवाइस के लिए */
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
}

.container {
    width: 100%;
    max-width: 1200px;
    margin: auto;
    padding: 15px;
}

/* Cards का layout */
.cards {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 15px;
}

.card img {
    width: 100%;
    height: auto;
    display: block;
}

/* Tablet */
@media (max-width: 900px) {
    .cards {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }
}

/* Mobile */
@media (max-width: 600px) {
    .cards {
        grid-template-columns: 1fr;
    }

    .container {
        padding: 10px;
    }

    h1 {
        font-size: 26px;
    }
}
